<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Online-only deals with coupon codes, discount links and exclusive offers on Neardis." />
  <meta name="theme-color" content="#ff2d55" />
  <link rel="manifest" href="/client/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <title>Online Deals — Neardis</title>
  <link rel="stylesheet" href="/client/css/global.css" />
  <link rel="stylesheet" href="/client/css/online.css" />
</head>
<body>
<div class="app-shell">
  <div id="header-slot"></div>
  <div id="sidebar-slot"></div>

  <main class="main-content" id="main-content">
    <div class="container page-padding">

      <!-- Hero -->
      <div class="online-hero animate-fade-in">
        <div class="online-hero__text">
          <h1 class="online-hero__title">🌐 Online Deals</h1>
          <p class="online-hero__subtitle">Exclusive coupon codes & discount links — shop from anywhere</p>
        </div>
        <div class="online-hero__stats" id="online-stats">
          <div class="online-stat">
            <span class="online-stat__value" id="stat-total">—</span>
            <span class="online-stat__label">Active Deals</span>
          </div>
          <div class="online-stat">
            <span class="online-stat__value" id="stat-coupons">—</span>
            <span class="online-stat__label">Coupon Codes</span>
          </div>
          <div class="online-stat">
            <span class="online-stat__value" id="stat-avg-discount">—</span>
            <span class="online-stat__label">Avg Discount</span>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="online-filters animate-fade-in">
        <div class="filter-pills" id="category-pills">
          <button class="pill pill--active" data-category="">All</button>
          <button class="pill" data-category="Food">🍔 Food</button>
          <button class="pill" data-category="Clothes">👗 Clothes</button>
          <button class="pill" data-category="Cosmetics">💄 Cosmetics</button>
          <button class="pill" data-category="Electronics">📱 Electronics</button>
          <button class="pill" data-category="Health">💊 Health</button>
          <button class="pill" data-category="Others">🎁 Others</button>
        </div>

        <div class="online-filters__right">
          <label class="toggle">
            <input type="checkbox" class="toggle__input" id="coupon-only-toggle" />
            <span class="toggle__track"></span>
            <span class="toggle__label">🏷️ Codes Only</span>
          </label>
          <select class="form-select" id="sort-select" style="width:auto;min-width:140px;font-size:0.8125rem;padding:0.375rem 2rem 0.375rem 0.75rem">
            <option value="">Newest</option>
            <option value="popular">Most Popular</option>
            <option value="discount">Highest Discount</option>
            <option value="expiring">Expiring Soon</option>
          </select>
        </div>
      </div>

      <!-- Deals Grid -->
      <div class="online-deals-grid stagger" id="online-deals-grid">
        <!-- JS fills this -->
      </div>

      <!-- Infinite Scroll -->
      <div class="load-more-wrap" id="load-more-wrap">
        <div class="load-more-spinner hidden" id="load-more-spinner">
          <div class="spinner"></div>
          <span>Loading more deals…</span>
        </div>
        <div id="infinite-scroll-trigger" style="height:1px"></div>
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-state__icon">🌐</div>
        <h3 class="empty-state__title">No online deals found</h3>
        <p class="empty-state__text">Try a different category or check back soon.</p>
        <button class="btn btn--primary mt-4" onclick="OnlinePage.reset()">Show All</button>
      </div>

    </div>
  </main>

  <div id="bottom-nav-slot"></div>
</div>

<script src="/client/js/api.js"></script>
<script src="/client/js/timer.js"></script>
<script src="/client/js/global.js"></script>
<script src="/client/js/online.js"></script>
</body>
</html>
