<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse deals by category — Food, Clothes, Cosmetics, Electronics and more on Neardis." />
  <meta name="theme-color" content="#ff2d55" />
  <link rel="manifest" href="/client/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <title>Categories — Neardis</title>
  <link rel="stylesheet" href="/client/css/global.css" />
  <link rel="stylesheet" href="/client/css/category.css" />
</head>
<body>
<div class="app-shell">
  <div id="header-slot"></div>
  <div id="sidebar-slot"></div>

  <main class="main-content" id="main-content">
    <div class="container page-padding">

      <!-- Page Title -->
      <div class="page-title-row animate-fade-in">
        <h1 class="page-title">Browse by Category</h1>
        <p class="page-subtitle">Find deals tailored to what you're looking for</p>
      </div>

      <!-- Category Cards Grid -->
      <div class="category-grid animate-fade-in" id="category-grid">
        <button class="category-card category-card--all active" data-category="">
          <div class="category-card__icon">🔥</div>
          <div class="category-card__name">All Deals</div>
          <div class="category-card__count" id="count-all">—</div>
        </button>
        <button class="category-card" data-category="Food" style="--cat-color:#ff6b35">
          <div class="category-card__icon">🍔</div>
          <div class="category-card__name">Food</div>
          <div class="category-card__count" id="count-Food">—</div>
        </button>
        <button class="category-card" data-category="Clothes" style="--cat-color:#bf5af2">
          <div class="category-card__icon">👗</div>
          <div class="category-card__name">Clothes</div>
          <div class="category-card__count" id="count-Clothes">—</div>
        </button>
        <button class="category-card" data-category="Cosmetics" style="--cat-color:#ff2d55">
          <div class="category-card__icon">💄</div>
          <div class="category-card__name">Cosmetics</div>
          <div class="category-card__count" id="count-Cosmetics">—</div>
        </button>
        <button class="category-card" data-category="Electronics" style="--cat-color:#0a84ff">
          <div class="category-card__icon">📱</div>
          <div class="category-card__name">Electronics</div>
          <div class="category-card__count" id="count-Electronics">—</div>
        </button>
        <button class="category-card" data-category="Health" style="--cat-color:#30d158">
          <div class="category-card__icon">💊</div>
          <div class="category-card__name">Health</div>
          <div class="category-card__count" id="count-Health">—</div>
        </button>
        <button class="category-card" data-category="Services" style="--cat-color:#32ade6">
          <div class="category-card__icon">🔧</div>
          <div class="category-card__name">Services</div>
          <div class="category-card__count" id="count-Services">—</div>
        </button>
        <button class="category-card" data-category="Others" style="--cat-color:#ffd60a">
          <div class="category-card__icon">🎁</div>
          <div class="category-card__name">Others</div>
          <div class="category-card__count" id="count-Others">—</div>
        </button>
      </div>

      <!-- Sub-filters -->
      <div class="sub-filters animate-fade-in" id="sub-filters">
        <div class="sub-filters__left">
          <span class="sub-filters__label" id="active-category-label">All Deals</span>
          <span class="sub-filters__divider">·</span>
          <select class="form-select sub-filter-select" id="sort-select">
            <option value="">Newest</option>
            <option value="popular">Most Popular</option>
            <option value="discount">Highest Discount</option>
            <option value="expiring">Expiring Soon</option>
          </select>
        </div>
        <div class="sub-filters__right">
          <label class="toggle">
            <input type="checkbox" class="toggle__input" id="flash-only-toggle" />
            <span class="toggle__track"></span>
            <span class="toggle__label">⚡ Flash Only</span>
          </label>
        </div>
      </div>

      <!-- Deals Grid -->
      <div class="deals-grid stagger" id="deals-grid">
        <!-- JS fills this -->
      </div>

      <!-- Load More -->
      <div class="load-more-wrap" id="load-more-wrap">
        <div class="load-more-spinner hidden" id="load-more-spinner">
          <div class="spinner"></div>
          <span>Loading more…</span>
        </div>
        <div id="infinite-scroll-trigger" style="height:1px"></div>
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-state__icon">🏷️</div>
        <h3 class="empty-state__title">No deals found</h3>
        <p class="empty-state__text">Try a different category or check back later.</p>
        <button class="btn btn--primary mt-4" onclick="CategoryPage.reset()">Show All</button>
      </div>

    </div>
  </main>

  <div id="bottom-nav-slot"></div>
</div>

<script src="/client/js/api.js"></script>
<script src="/client/js/haversine.js"></script>
<script src="/client/js/timer.js"></script>
<script src="/client/js/global.js"></script>
<script src="/client/js/category.js"></script>
</body>
</html>
